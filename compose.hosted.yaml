# Hosted Better Auth + PostgreSQL overlay for Docker.
# Start with: docker compose -f compose.yaml -f compose.hosted.yaml up -d
services:
  open-seo:
    environment:
      - AUTH_MODE=hosted
      - DATABASE_PROVIDER=postgres
      - BETTER_AUTH_URL=${BETTER_AUTH_URL}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - POSTGRES_DATABASE_URL=${POSTGRES_DATABASE_URL}
      - ALLOWED_HOST=${ALLOWED_HOST}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-stealth/union-alpha}
      - OPENSEO_TELEMETRY_DISABLED=${OPENSEO_TELEMETRY_DISABLED:-1}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY}
      - TURNSTILE_SITE_KEY=${TURNSTILE_SITE_KEY}
      - DATAFORSEO_API_KEY=${DATAFORSEO_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    networks:
      - open-seo-db

networks:
  # Create this as an internal Docker network and attach the private
  # PostgreSQL service to it. Never publish PostgreSQL's port to the Internet.
  open-seo-db:
    name: ${OPEN_SEO_DB_NETWORK:-open-seo-db}
    external: true
